<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversion de points</title>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    main {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
    }

    h1 { margin-top: 0; }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }

    label { font-weight: 600; font-size: 0.9rem; }

    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    button, .bouton {
      display: inline-block;
      font-family: inherit;
      font-weight: normal;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button.supprimer { background: none; color: #b91c1c; }

    .import { margin-top: 1rem; }

    table { width: 100%; margin-top: 1.5rem; border-collapse: collapse; }
    th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #e5e7eb; }

    #generer { margin-top: 1.5rem; }

    #message { margin-top: 1rem; }

    @media (max-width: 600px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Conversion de points</h1>
    <p>Lambert I Nord Maroc vers WGS 84, puis fichier KML.</p>

    <form id="formulaire">
      <div>
        <label for="nom">Nom</label>
        <input id="nom" type="text" placeholder="B1" required>
      </div>
      <div>
        <label for="x">X</label>
        <input id="x" type="text" inputmode="decimal" placeholder="640503,59" required>
      </div>
      <div>
        <label for="y">Y</label>
        <input id="y" type="text" inputmode="decimal" placeholder="507739,08" required>
      </div>
      <button type="submit">Ajouter</button>
    </form>

    <div class="import">
      <label for="csv" class="bouton">Choisir un fichier CSV</label>
      <input id="csv" type="file" accept=".csv" hidden>
    </div>

    <table>
      <thead>
        <tr><th>Nom</th><th>X</th><th>Y</th><th></th></tr>
      </thead>
      <tbody id="tableau"></tbody>
    </table>

    <button id="generer">Générer le fichier KML</button>
    <p id="message"></p>
  </main>

  <script>
    const LAMBERT = "+proj=lcc +lat_1=33.3 +lat_0=33.3 +lon_0=-5.4 +k_0=0.999625769 +x_0=500000 +y_0=300000 +a=6378249.2 +rf=293.4660212936269 +towgs84=31,146,47,0,0,0,0 +units=m +no_defs";
    const WGS84 = "+proj=longlat +datum=WGS84 +no_defs";

    const points = [];

    const formulaire = document.getElementById("formulaire");
    const nom = document.getElementById("nom");
    const x = document.getElementById("x");
    const y = document.getElementById("y");
    const csv = document.getElementById("csv");
    const tableau = document.getElementById("tableau");
    const generer = document.getElementById("generer");
    const message = document.getElementById("message");

    function lireNombre(texte) {
      const nombre = Number(texte.trim().replace(",", "."));
      return texte.trim() === "" || isNaN(nombre) ? null : nombre;
    }

    function echapper(texte) {
      return texte.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function afficherTableau() {
      tableau.innerHTML = "";
      points.forEach((point, i) => {
        const ligne = tableau.insertRow();
        ligne.insertCell().textContent = point.nom;
        ligne.insertCell().textContent = point.x;
        ligne.insertCell().textContent = point.y;

        const bouton = document.createElement("button");
        bouton.textContent = "✕";
        bouton.className = "supprimer";
        bouton.onclick = () => {
          points.splice(i, 1);
          afficherTableau();
        };
        ligne.insertCell().appendChild(bouton);
      });
    }

    function creerKml() {
      const convertis = points.map((p) => {
        const [lon, lat] = proj4(LAMBERT, WGS84, [p.x, p.y]);
        return { ...p, lon, lat };
      });

      const coordonnees = (p) => `${p.lon.toFixed(8)},${p.lat.toFixed(8)},0`;

      let kml = `<?xml version="1.0" encoding="utf-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Tracé Lambert I Nord Maroc</name>
    <Style id="trace">
      <LineStyle>
        <color>ff0000ff</color>
        <width>3</width>
      </LineStyle>
    </Style>
`;

      for (const p of convertis) {
        kml += `    <Placemark>
      <name>${echapper(p.nom)}</name>
      <description>Lambert I : X = ${p.x.toFixed(2)}, Y = ${p.y.toFixed(2)}
WGS 84 : Lat = ${p.lat.toFixed(7)}, Lon = ${p.lon.toFixed(7)}</description>
      <Point>
        <coordinates>${coordonnees(p)}</coordinates>
      </Point>
    </Placemark>
`;
      }

      if (convertis.length >= 2) {
        const boucle = [...convertis, convertis[0]];
        kml += `    <Placemark>
      <name>Tracé fermé</name>
      <styleUrl>#trace</styleUrl>
      <LineString>
        <tessellate>1</tessellate>
        <coordinates>${boucle.map(coordonnees).join(" ")}</coordinates>
      </LineString>
    </Placemark>
`;
      }

      return kml + `  </Document>
</kml>
`;
    }

    formulaire.addEventListener("submit", (e) => {
      e.preventDefault();
      const valeurX = lireNombre(x.value);
      const valeurY = lireNombre(y.value);

      if (valeurX === null || valeurY === null) {
        message.textContent = "X et Y doivent être des nombres.";
        return;
      }

      points.push({ nom: nom.value.trim(), x: valeurX, y: valeurY });
      afficherTableau();
      formulaire.reset();
      message.textContent = "";
      nom.focus();
    });

    csv.addEventListener("change", async () => {
      const texte = await csv.files[0].text();
      let ajoutes = 0;

      for (const ligne of texte.split("\n")) {
        const colonnes = ligne.split(ligne.includes(";") ? ";" : ",");
        if (colonnes.length < 3) continue;

        const valeurX = lireNombre(colonnes[1]);
        const valeurY = lireNombre(colonnes[2]);
        if (valeurX === null || valeurY === null) continue;

        points.push({ nom: colonnes[0].trim(), x: valeurX, y: valeurY });
        ajoutes++;
      }

      afficherTableau();
      message.textContent = ajoutes + " point(s) importé(s).";
      csv.value = "";
    });

    generer.addEventListener("click", () => {
      if (points.length === 0) {
        message.textContent = "Ajoute au moins un point.";
        return;
      }

      const fichier = new Blob([creerKml()], { type: "application/vnd.google-earth.kml+xml" });
      const lien = document.createElement("a");
      lien.href = URL.createObjectURL(fichier);
      lien.download = "trace_lambert1.kml";
      document.body.appendChild(lien);
      lien.click();
      lien.remove();
      message.textContent = "Fichier téléchargé.";
    });
  </script>
</body>
</html>
